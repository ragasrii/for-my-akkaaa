
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Akka's Birthday</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #fff8f3, #f9e5e7, #f7eee7);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.hidden {
    display: none;
}

/* FIRST PAGE */

.question-box {
    width: 88%;
    max-width: 520px;
    padding: 60px 25px;
    background: rgba(255,255,255,0.7);
    border-radius: 32px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(120,80,80,0.16);
    backdrop-filter: blur(12px);
}

.question {
    font-size: 22px;
    color: #805f5f;
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 18px;
}

button {
    border: none;
    padding: 14px 35px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.yes {
    background: #d99b9b;
    color: white;
}

.no {
    background: #ead2d2;
    color: #795f5f;
}

button:hover {
    transform: scale(1.08);
}

.crying {
    margin-top: 30px;
    font-size: 19px;
    color: #a56f78;
    display: none;
}

/* COUNTDOWN PAGE */

.countdown-box {
    width: 90%;
    max-width: 700px;
    padding: 45px 25px;
    background: rgba(255,255,255,0.72);
    border-radius: 35px;
    text-align: center;
    box-shadow: 0 20px 55px rgba(120,80,80,0.18);
    backdrop-filter: blur(12px);
}

.birthday {
    font-size: 50px;
    margin-bottom: 25px;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.time {
    background: rgba(255,255,255,0.82);
    border-radius: 20px;
    padding: 20px 8px;
    box-shadow: 0 8px 20px rgba(100,70,70,0.1);
}

.number {
    display: block;
    font-size: 32px;
    color: #b97878;
    font-weight: bold;
}

.label {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    color: #8c7070;
}

@media(max-width:500px) {

    .question {
        font-size: 19px;
    }

    .buttons {
        gap: 10px;
    }

    button {
        padding: 13px 28px;
    }

    .countdown {
        gap: 7px;
    }

    .time {
        padding: 16px 4px;
    }

    .number {
        font-size: 23px;
    }

    .label {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<!-- PAGE 1 -->

<div class="page" id="page1">

    <div class="question-box">

        <div class="question">
            Do you want to open your surprise akka?
        </div>

        <div class="buttons">

            <button class="yes" onclick="yesClicked()">
                YES
            </button>

            <button class="no" onclick="noClicked()">
                NO
            </button>

        </div>

        <div class="crying" id="crying">
            Aww your cute sister is cryinggg 😭💗
        </div>

    </div>

</div>


<!-- PAGE 2 -->

<div class="page hidden" id="page2">

    <div class="countdown-box">

        <div class="birthday">
            hehehehe>un pirandhanaal naatkal
        </div>

        <div class="countdown">

            <div class="time">
                <span class="number" id="days">00</span>
                <span class="label">DAYS</span>
            </div>

            <div class="time">
                <span class="number" id="hours">00</span>
                <span class="label">HOURS</span>
            </div>

            <div class="time">
                <span class="number" id="minutes">00</span>
                <span class="label">MINUTES</span>
            </div>

            <div class="time">
                <span class="number" id="seconds">00</span>
                <span class="label">SECONDS</span>
            </div>

        </div>

    </div>

</div>


<script>

function yesClicked() {

    document.getElementById("page1").classList.add("hidden");

    document.getElementById("page2").classList.remove("hidden");

}

function noClicked() {

    document.getElementById("crying").style.display = "block";

}


function updateCountdown() {

    const now = new Date();

    let year = now.getFullYear();

    let birthday = new Date(
        year,
        2,
        10,
        0,
        0,
        0
    );

    if (now >= birthday) {

        birthday = new Date(
            year + 1,
            2,
            10,
            0,
            0,
            0
        );

    }

    const difference = birthday - now;

    const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
        (difference / 1000) % 60
    );


    document.getElementById("days").textContent =
        String(days).padStart(2, "0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");

}

updateCountdown();

setInterval(updateCountdown, 1000);

</script>

</body>
</html>
