```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akka's Birthday</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fff8f2, #f9e8e8, #f8f1e8);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.8s ease;
}

.hidden {
    display: none;
}

/* PAGE 1 */

.welcome-box {
    width: 85%;
    max-width: 520px;
    padding: 65px 30px;
    background: rgba(255,255,255,0.65);
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(120,80,80,0.15);
    backdrop-filter: blur(10px);
}

.heart {
    font-size: 55px;
    margin-bottom: 30px;
}

.enter-btn {
    border: none;
    padding: 15px 42px;
    border-radius: 30px;
    background: #d89a9a;
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: 0.3s;
}

.enter-btn:hover {
    transform: scale(1.08);
    background: #c98585;
}

/* PAGE 2 */

.countdown-box {
    width: 90%;
    max-width: 700px;
    padding: 45px 25px;
    background: rgba(255,255,255,0.72);
    border-radius: 35px;
    text-align: center;
    box-shadow: 0 20px 55px rgba(120,80,80,0.18);
    backdrop-filter: blur(12px);
}

.birthday-icon {
    font-size: 50px;
    margin-bottom: 25px;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.time {
    background: rgba(255,255,255,0.8);
    border-radius: 20px;
    padding: 20px 8px;
    box-shadow: 0 8px 20px rgba(100,70,70,0.1);
}

.number {
    display: block;
    font-size: 32px;
    color: #b97878;
    font-weight: bold;
}

.label {
    font-size: 13px;
    color: #8c7070;
    margin-top: 6px;
    display: block;
}

@media(max-width: 500px) {
    .countdown-box {
        padding: 35px 15px;
    }

    .countdown {
        gap: 8px;
    }

    .time {
        padding: 16px 5px;
    }

    .number {
        font-size: 24px;
    }

    .label {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<!-- PAGE 1 -->

<div class="page" id="page1">

    <div class="welcome-box">

        <div class="heart">♡</div>

        <button class="enter-btn" onclick="openBirthday()">
            Open
        </button>

    </div>

</div>


<!-- PAGE 2 -->

<div class="page hidden" id="page2">

    <div class="countdown-box">

        <div class="birthday-icon">🎂</div>

        <div class="countdown">

            <div class="time">
                <span class="number" id="days">00</span>
                <span class="label">DAYS</span>
            </div>

            <div class="time">
                <span class="number" id="hours">00</span>
                <span class="label">HOURS</span>
            </div>

            <div class="time">
                <span class="number" id="minutes">00</span>
                <span class="label">MINUTES</span>
            </div>

            <div class="time">
                <span class="number" id="seconds">00</span>
                <span class="label">SECONDS</span>
            </div>

        </div>

    </div>

</div>


<script>

function openBirthday() {
    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.remove("hidden");
}

function updateCountdown() {

    const now = new Date();

    let year = now.getFullYear();

    // March 10 of the current year
    let birthday = new Date(year, 2, 10, 0, 0, 0);

    // If March 10 has already passed, use next year
    if (now >= birthday) {
        birthday = new Date(year + 1, 2, 10, 0, 0, 0);
    }

    const difference = birthday - now;

    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((difference / (1000 * 60)) % 60);
    const seconds = Math.floor((difference / 1000) % 60);

    document.getElementById("days").textContent =
        String(days).padStart(2, "0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
